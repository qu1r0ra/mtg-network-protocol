[project]
name = "mtg-network-protocol"
version = "0.1.0"
description = "MTGNP v1.0 — TCP client-server implementation of the Magic: The Gathering Multiplayer Network Protocol (RFC 0001, CSNETWK)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
]

[project.scripts]
mtgnp-server = "mtgnp.server.__main__:main"
mtgnp-client = "mtgnp.client.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtgnp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
